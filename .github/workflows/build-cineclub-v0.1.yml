name: Build Cine Club V0.1 APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 36 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Restore stable Cine Club debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: cine-club-debug-keystore-v1

      - name: Ensure stable Cine Club debug signing key
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Cine Club Debug,O=Cine Club,C=LU" \
              -keyalg RSA -keysize 2048 -validity 10000
          fi

      - name: Unpack Cine Club source
        run: |
          rm -rf buildsrc
          mkdir buildsrc
          unzip -q CineClub-source-v0.1.zip -d buildsrc
          test -f buildsrc/CineClub/settings.gradle.kts

      - name: Run unit tests
        working-directory: buildsrc/CineClub
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Build debug APK
        working-directory: buildsrc/CineClub
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload Cine Club APK
        uses: actions/upload-artifact@v4
        with:
          name: cine-club-v0.1-debug-apk
          path: buildsrc/CineClub/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
